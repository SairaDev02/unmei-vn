# Dependency policy for the shipped workspace, agreed at the dependency review
# whose recorded baseline run is the reference. `.github/workflows/deny.yml` runs
# this on every push and PR; the baseline it must pass is zero errors, exactly
# the two advisory exceptions at the bottom of `[advisories]`.
#
# The accepted-license list is one of two copies. `packaging/about.toml`'s
# `accepted` list is the other, and cargo-about reads that one to build the
# shipped notices. Neither tool reads the other's file, so
# `scripts/check-invariants.py --rules licenses` fails when the two sets differ.

[graph]
# Both shipping targets, every feature, dev dependencies included. One run is
# the union of the two triples, and `licenses.include-dev` below needs the dev
# edges this leaves in place.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true
exclude-dev = false

[licenses]
# The same 13 identifiers as `packaging/about.toml`'s `accepted` list. `allow`
# is a set here: the priority order that file needs to choose which `OR` text
# ships has no meaning in this one.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MIT-0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

# Dev-only crates pass this check only with this on, because the check drops
# dev edges by default even when `[graph] exclude-dev` is false. Build
# dependencies are included by default, as in `packaging/about.toml`.
include-dev = true

# Workspace members are not third-party code, and `unmei-app` declares no
# license at all (it is `publish = false`).
private = { ignore = true }

# `ring` declares `Apache-2.0 AND ISC`, but its `LICENSE` file holds the four
# texts of the ring project, including OpenSSL-derived files from BoringSSL. The
# hash is cargo-deny's own 32-bit hash of that file: a version bump that changes
# the file drops the clarification instead of silently keeping a stale
# expression, and the crate then falls back to its declared license.
[[licenses.clarify]]
crate = "ring"
expression = "ISC AND OpenSSL AND MIT"
license-files = [{ path = "LICENSE", hash = 0x0d99693a }]

[advisories]
# The defaults are narrower than the policy. `unsound` defaults to reporting
# only a direct dependency of a workspace member, so `all` is what makes a
# transitive unsound advisory an error; `unmaintained` already defaults to all
# depths and is stated for the same reason.
unsound = "all"
unmaintained = "all"
# A yanked release is a warning, not an error: whether the locked graph can
# move is a decision the maintainer makes by hand.
yanked = "warn"

# Fixed so the workflow can report the advisory database's commit by reading the
# checkout afterwards (cargo-deny prints neither). Every run fetches the
# database online and nothing caches this path, so a stale copy cannot pass.
db-path = "target/deny-advisory-dbs"

# The two exceptions the baseline review approved. Each names its owner and a
# review date instead of hiding the finding.
ignore = [
    { id = "RUSTSEC-2026-0344", reason = "Owner: the maintainer. Vulnerable ruzstd 0.8.3 is reached only through Bevy's image decoding, Bevy 0.19.1 pins 0.8, and packs are local authored content. Review at the next Bevy upgrade or by 2027-04-30, whichever is first." },
    { id = "RUSTSEC-2026-0192", reason = "Owner: the maintainer. ttf-parser is unmaintained and no upgrade exists; it is reached through winit on Linux only. Review at the next Bevy upgrade or by 2027-04-30, whichever is first." },
]

[sources]
# crates.io only. Both unknown-source levels default to `warn`, which would let
# an unapproved registry or git source through with a warning rather than a
# failing check; this policy wants the error.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-registry = "deny"
unknown-git = "deny"
