name: candidate

# One dispatch on `main` at a candidate SHA produces machine evidence for that
# exact commit. Every job either proves a stage or writes the slot that records
# why it could not, and the record job turns this attempt into the immutable
# `candidate-record.json` that `publish.yml` reads.
#
# Nothing here publishes, tags, releases or moves a branch, so the coordinator
# holds no secret: `contents: read` and `actions: read` only.
#
# The run fails only on an eligibility, gate, packaging or hash failure. The
# dependency and boot checks are called with `record_only`, so their verdicts
# land in the record's `deny` and `linux-shipping-boot` slots and the called jobs
# stay green; their own push, PR, scheduled and manual runs still fail on a bad
# verdict.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Candidate commit SHA, a 40-hex commit on main
        required: true
        type: string
      rehearsal:
        description: Rehearsal; passes --allow-placeholders and stamps the record
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Two dispatches on one SHA are two attempts; the earlier record stays as
# evidence rather than being replaced or cancelled.
concurrency:
  group: candidate-${{ inputs.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.sha }}
  REHEARSAL: ${{ inputs.rehearsal }}
  # Retention is one value here, but a called workflow cannot inherit it:
  # `deny.yml` and `boot.yml` repeat 90 in their own upload steps.
  RETENTION_DAYS: "90"
  # The runner images the packaging and acceptance jobs use; the record states
  # them, and Linux is 24.04 rather than 22.04 because the released archives
  # carry the build host's glibc floor (2.39) and 22.04 retires in 2027.
  RUNNER_WINDOWS: windows-2025
  RUNNER_LINUX: ubuntu-24.04

jobs:
  eligibility:
    name: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Its upload's name, for later jobs; a re-run that reuses this job keeps it.
    outputs:
      artifact: eligibility-${{ inputs.sha }}-attempt${{ github.run_attempt }}
    steps:
      # The coordinator checks out its own revision: the scripts that judge the
      # candidate must be the reviewed ones, not whatever the candidate carried.
      # A full history is what lets `eligibility` prove main ancestry itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse anything that is not a candidate dispatch
        run: |
          set -euo pipefail
          python3 scripts/candidate_record.py eligibility \
            --sha "$CANDIDATE_SHA" \
            --ref "$GITHUB_REF" \
            --coordinator-revision "$GITHUB_SHA" \
            --json-out eligibility.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eligibility-${{ inputs.sha }}-attempt${{ github.run_attempt }}
          path: eligibility.json
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  # The gate always reruns at the candidate SHA: an earlier main push is context
  # only, because a re-run of this attempt has to stand on its own.
  gate:
    name: gate
    needs: eligibility
    uses: ./.github/workflows/check.yml
    with:
      sha: ${{ inputs.sha }}

  packaging-windows:
    name: packaging windows
    needs: eligibility
    runs-on: windows-2025
    outputs:
      artifact: packaging-windows-${{ inputs.sha }}-attempt${{ github.run_attempt }}
    # A cold release build alone took 38 minutes on windows-2025 (run
    # 42455736603: the whole job 48), and every Cargo.lock change is cold.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Install pinned toolchain
        shell: bash
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The packager refuses any other version and prints this exact command.
      - name: Install the pinned cargo-about
        shell: bash
        run: cargo install --locked cargo-about@0.9.3 --features cli

      - name: Build both archives and both crates
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/package"
          flags=()
          if [ "$REHEARSAL" = "true" ]; then flags+=(--allow-placeholders); fi
          python3 scripts/package.py --out "$out" "${flags[@]}"

      # The executables do not survive as files, so their digests are read back
      # out of the archives this job just wrote; the record rechecks them.
      - name: Sum the executables out of their archives
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/package"
          args=()
          for archive in "$out"/unmei-play-*.zip "$out"/unmei-[0-9]*.zip; do
            args+=(--archive "$archive")
          done
          python3 scripts/candidate_facts.py executables "${args[@]}" \
            --out "$out/packaging-windows-executables.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-windows-${{ inputs.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/package
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  packaging-linux:
    name: packaging linux
    needs: eligibility
    runs-on: ubuntu-24.04
    outputs:
      artifact: packaging-linux-${{ inputs.sha }}-attempt${{ github.run_attempt }}
    # A cold release build alone took 38 minutes on windows-2025 (run
    # 42455736603: the whole job 48), and every Cargo.lock change is cold.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      # The player links these system libraries at build time, the same set the
      # gate's Linux build installs in `check.yml`.
      - name: Install Linux build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
          libfontconfig1-dev

      - name: Install pinned toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install the pinned cargo-about
        run: cargo install --locked cargo-about@0.9.3 --features cli

      - name: Build both archives and both crates
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/package"
          flags=()
          if [ "$REHEARSAL" = "true" ]; then flags+=(--allow-placeholders); fi
          python3 scripts/package.py --out "$out" "${flags[@]}"

      - name: Sum the executables out of their archives
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/package"
          args=()
          for archive in "$out"/unmei-play-*.tar.gz "$out"/unmei-[0-9]*.tar.gz; do
            args+=(--archive "$archive")
          done
          python3 scripts/candidate_facts.py executables "${args[@]}" \
            --out "$out/packaging-linux-executables.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-linux-${{ inputs.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/package
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  # The CLI's package can only be built against a published engine, so the
  # overlay dry run is what proves it here. The registry check stays pending
  # until `unmei-engine` is on crates.io, and the slot's reason says so.
  crate-overlay:
    name: crate overlay
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Install pinned toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Prove both crates through the local overlay
        id: overlay
        continue-on-error: true
        run: cargo publish --workspace --exclude unmei-app --locked --dry-run

      - name: Write the crate-overlay slot
        if: ${{ always() }}
        run: |
          set -euo pipefail
          status=passed
          reason="the workspace dry run proves both packages through the local overlay; the CLI's registry check stays pending until unmei-engine is published"
          if [ "${{ steps.overlay.outcome }}" != "success" ]; then
            status=failed
            reason="cargo publish --dry-run failed; this job's log carries the error"
          fi
          python3 scripts/candidate_facts.py slot --name crate-overlay \
            --status "$status" --reason "$reason" --out crate-overlay-slot.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: crate-overlay-slot-${{ inputs.sha }}-attempt${{ github.run_attempt }}
          path: crate-overlay-slot.json
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  deny:
    name: deny
    needs: eligibility
    uses: ./.github/workflows/deny.yml
    with:
      sha: ${{ inputs.sha }}
      record_only: true

  coverage:
    name: coverage
    needs: eligibility
    uses: ./.github/workflows/coverage.yml
    with:
      sha: ${{ inputs.sha }}

  boot:
    name: boot
    needs: eligibility
    uses: ./.github/workflows/boot.yml
    with:
      sha: ${{ inputs.sha }}
      record_only: true

  accept-windows:
    name: accept windows
    needs: packaging-windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the staged archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.packaging-windows.outputs.artifact }}
          path: package
          digest-mismatch: error

      # The player's Windows boots and its functional walk are the maintainer's
      # real-GPU walk (a residual), so this job checks the archive a user gets.
      - name: Accept the archive
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/archive_accept.py accept --archive-dir package --os windows \
            --out accept-windows-slot.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: accept-windows-slot-${{ inputs.sha }}-attempt${{ github.run_attempt }}
          path: accept-windows-slot.json
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  accept-linux:
    name: accept linux
    needs: packaging-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the staged archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.packaging-linux.outputs.artifact }}
          path: package
          digest-mismatch: error

      # The display, the runtime library winit dlopens, and the software
      # rasterizer the real window needs under Xvfb.
      - name: Install Linux dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2t64 libudev1 libfontconfig1 libwayland-client0 libvulkan1
          libxkbcommon0 libxkbcommon-x11-0 mesa-vulkan-drivers xvfb xauth xdotool

      - name: Extract both archives
        run: |
          set -euo pipefail
          mkdir -p extracted
          for archive in package/*.tar.gz; do tar -xzf "$archive" -C extracted; done

      - name: Accept the archive
        id: static
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/archive_accept.py accept --archive-dir package --os linux \
            --out accept-static.json

      # A healthy player has no frame cap, so the bound killing it is the
      # expected outcome; anything else means it stopped on its own.
      - name: Boot the archived player, normal and --dev
        id: boot
        continue-on-error: true
        run: python3 scripts/archive_accept.py boot --extracted extracted

      - name: Walk the archived player
        id: walk
        continue-on-error: true
        run: python3 scripts/linux_walk.py extracted

      # One slot per outcome: the archive acceptance including its boots, and
      # the walk on its own, because the record carries them separately.
      - name: Write the acceptance slots
        if: ${{ always() }}
        run: |
          set -euo pipefail
          status=passed
          reasons=()
          if [ "${{ steps.static.outcome }}" != "success" ]; then
            status=failed
            reasons+=("the archive checks failed")
          fi
          if [ "${{ steps.boot.outcome }}" != "success" ]; then
            status=failed
            reasons+=("the bounded boots failed")
          fi
          python3 scripts/candidate_facts.py slot --name accept-linux --status "$status" \
            --reason "$(IFS='; '; echo "${reasons[*]}")" --out accept-linux-slot.json
          walk=passed
          walk_reason=""
          if [ "${{ steps.walk.outcome }}" != "success" ]; then
            walk=failed
            walk_reason="the walk failed; its log names the step it missed"
          fi
          python3 scripts/candidate_facts.py slot --name linux-walk --status "$walk" \
            --reason "$walk_reason" --out linux-walk-slot.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: accept-linux-slots-${{ inputs.sha }}-attempt${{ github.run_attempt }}
          path: |
            accept-linux-slot.json
            linux-walk-slot.json
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error

  record:
    name: record
    needs:
      - eligibility
      - gate
      - packaging-windows
      - packaging-linux
      - crate-overlay
      - deny
      - coverage
      - boot
      - accept-windows
      - accept-linux
    # Every attempt of an eligible candidate gets a record, whatever else
    # failed. A refused dispatch is not a candidate: its eligibility log is the
    # evidence, and there is nothing staged to record.
    if: ${{ always() && needs.eligibility.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned toolchain
        run: rustup toolchain install --no-self-update

      # Everything this attempt uploaded, downloaded again: the record rechecks
      # every digest and sum rather than trusting the job that produced it.
      - name: Download every artifact of this run
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --dir staging
          ls -1 staging

      - name: Assemble the observations
        env:
          ARTIFACT_ELIGIBILITY: ${{ needs.eligibility.outputs.artifact }}
          CONCLUSION_ELIGIBILITY: ${{ needs.eligibility.result }}
          CONCLUSION_GATE: ${{ needs.gate.result }}
          CONCLUSION_PACKAGING_WINDOWS: ${{ needs.packaging-windows.result }}
          CONCLUSION_PACKAGING_LINUX: ${{ needs.packaging-linux.result }}
          CONCLUSION_CRATE_OVERLAY: ${{ needs.crate-overlay.result }}
          CONCLUSION_DENY: ${{ needs.deny.result }}
          CONCLUSION_COVERAGE: ${{ needs.coverage.result }}
          CONCLUSION_BOOT: ${{ needs.boot.result }}
          CONCLUSION_ACCEPT_WINDOWS: ${{ needs.accept-windows.result }}
          CONCLUSION_ACCEPT_LINUX: ${{ needs.accept-linux.result }}
        run: |
          set -euo pipefail
          git cat-file -p "$CANDIDATE_SHA:Cargo.lock" > candidate-Cargo.lock
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100"             > artifacts-api.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100"             > jobs-api.json
          python3 scripts/candidate_facts.py observations             --eligibility "staging/${ARTIFACT_ELIGIBILITY}/eligibility.json"             --artifacts-api artifacts-api.json --jobs-api jobs-api.json             --cargo-lock candidate-Cargo.lock --out observations.json

      # A packaging job that failed left no artifact, so its slot becomes
      # `failed` and the record still exists: only the bytes that were staged can
      # be hashed, and crate-parity then stays pending.
      # Each packaging job's own upload, from its outputs: a reused job's is an
      # earlier attempt's. A job that did not succeed stages nothing for this
      # record, even if an earlier attempt of it left an artifact behind.
      - name: Build the facts file
        env:
          PACKAGING_WINDOWS: ${{ needs.packaging-windows.result == 'success' && needs.packaging-windows.outputs.artifact || '' }}
          PACKAGING_LINUX: ${{ needs.packaging-linux.result == 'success' && needs.packaging-linux.outputs.artifact || '' }}
        run: |
          set -euo pipefail
          args=()
          for pair in "packaging-windows=${PACKAGING_WINDOWS}" "packaging-linux=${PACKAGING_LINUX}"; do
            job="${pair%%=*}"
            artifact="${pair#*=}"
            if [ -n "$artifact" ] && [ -d "staging/${artifact}" ]; then
              args+=(--artifact "${job}=staging/${artifact}")
            fi
          done
          python3 scripts/candidate_facts.py build --observations observations.json \
            "${args[@]}" --staging staging --out facts.json

      - name: Find the earlier attempt's record
        run: |
          set -euo pipefail
          previous="$(python3 scripts/candidate_facts.py previous --staging staging             --attempt "$GITHUB_RUN_ATTEMPT")"
          if [ -n "$previous" ]; then
            echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
            echo "an earlier attempt's record: $previous"
          fi

      # %B is the whole message; the parser reads the subject too.
      - name: Write the record
        run: |
          set -euo pipefail
          args=()
          if [ -n "${PREVIOUS:-}" ]; then args+=(--previous "$PREVIOUS"); fi
          git log -1 --format=%B "$CANDIDATE_SHA" > message.txt
          python3 scripts/candidate_record.py record --facts facts.json \
            --message message.txt --out record "${args[@]}"
          # The release carries one sums file, merged from both packaging jobs,
          # because two same-named ones could not both be release assets.
          python3 scripts/candidate_facts.py release-sums --facts facts.json \
            --out record/SHA256SUMS
          cp facts.json record/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: candidate-record-${{ inputs.sha }}-attempt${{ github.run_attempt }}
          path: record
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
