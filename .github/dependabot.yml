# Every third-party action is pinned to a full commit SHA. Dependabot opens a
# weekly PR that moves the pin and rewrites the `# vX.Y.Z` comment on that line;
# merging it is the review.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for the whole set: these pins move together, and a single diff
    # keeps the SHAs and their version comments easy to check against the
    # upstream tags.
    groups:
      github-actions:
        patterns:
          - "*"
    # A short prefix so a bot commit reads like the hand-written ones beside it.
    commit-message:
      prefix: ci
