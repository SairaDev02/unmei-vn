name: Bug report
description: Report something that is broken or behaves unexpectedly
labels: [ 'needs-triage' ]
type: Bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the issue.
      placeholder: |
        1. Run '...'
        2. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The Unmei release you ran, or the commit you built it from.
      placeholder: 0.1.0, or the short commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and runtime version — whatever else is relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: If applicable, add logs, stack traces, or screenshots.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I reproduced this on the version or commit named above
          required: true
        - label: I searched the existing issues for a duplicate
          required: true
