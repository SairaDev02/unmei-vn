<!doctype html>
<!--
  PROTOTYPE — throwaway. Not part of the player build. Lives on branch
  `prototype/vn-ui-redesign` only; never merge to main.

  Question: what should Unmei's default VN look be (play frame, title, Esc
  menu) for the improved demo pack and default installs?

  Verdict (Jesse, 2026-11-14): variant E is final. E takes A's dialogue box
  (speaker tab, quick row, 'Ace is deciding' in the box), A's centred choice
  buttons and A's left-list title, and B's full-screen contents page as the
  Esc menu. A-D stay here only as the comparison record. Open at the verdict:
  A's title darkens the pack art's left side, which the Title layout spec
  forbids ("no veil"); that spec or the gradient has to give.

  Plan: four structurally different variants of one shared VN model (the
  demo pack's real script, background, Ace sprites and bundled fonts), at the
  1280x720 reference frame, switchable via `?variant=A|B|C|D|E` and the
  floating bottom bar. E mixes the picks (A play/title, B Esc menu).
  `?screen=title|play|menu` picks the surface.

  Run (from the repository root):
      python -m http.server 8137
  then open http://localhost:8137/app/prototype/vn-ui.html

  Bevy-feasibility constraint: every variant uses only what Bevy 0.19 UI
  draws — solid/alpha fills, linear/radial gradients, borders, corner radius,
  box shadow, text shadow, images. No backdrop-filter, filter, clip-path or
  blend modes. Animations are simple opacity/offset loops.

  Simulated: the `decide ace.greet` request (≈2.4 s, warm if affinity is
  high, else cold), save slots (static), Settings/Gallery/Timeline views.
-->

.vD .t-legend { position: absolute; bottom: 22px; left: 40px; font-family: Fira; font-size: 11px; color: rgba(205,205,215,.35); }
.vD .grp { font-family: Fira; font-size: 10px; letter-spacing: .24em; color: rgba(205,205,215,.4); margin: 18px 4px 8px; }
.vD .m-body { flex: 1; padding: 6px 22px; overflow: hidden; }
.vD .srow { display: flex; align-items: center; gap: 14px; padding: 11px 14px; background: #171a22; border-radius: 10px; margin-bottom: 6px; }
.vD .srow .k { width: 74px; font-weight: 600; font-size: 14px; } .vD .srow .meta { flex: 1; font-family: Fira; font-size: 11px; color: rgba(205,205,215,.55); line-height: 1.5; }
.vD .srow em { font-style: normal; font-size: 13px; color: #e69e5c; } .vD .srow em.dis { color: #8d909c; }
.vD .seg { display: inline-flex; background: #0b0c11; border-radius: 8px; padding: 3px; margin-left: auto; }
.vD .seg span { padding: 5px 14px; font-size: 13px; border-radius: 6px; color: #a9acb8; } .vD .seg span.on { background: #262935; color: #fff; }
.vD .m-body .row { padding: 7px 12px; margin-bottom: 0; } .vD .m-body .grp { margin: 12px 4px 6px; }
.vD .m-art-dim { position: absolute; left: 0; top: 0; bottom: 0; width: 820px; background: rgba(6,7,10,.55); }

/* ───────────── Prototype switcher (not part of any design) ───────────── */
#proto-bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px;
  background: #fff; color: #111; border-radius: 999px; padding: 6px 10px; box-shadow: 0 6px 24px rgba(0,0,0,.6); font: 13px system-ui, sans-serif; z-index: 10; white-space: nowrap; }
#proto-bar button { border: 0; background: #eee; border-radius: 999px; padding: 6px 11px; font: inherit; cursor: pointer; }
#proto-bar button:hover { background: #ddd; } #proto-bar button.on { background: #111; color: #fff; }
#proto-bar .lbl { font-weight: 700; min-width: 250px; text-align: center; }
#proto-bar .sep { width: 1px; height: 20px; background: #ccc; margin: 0 4px; }
#proto-bar .tag { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #c33; }
#proto-state { position: fixed; left: 12px; top: 10px; font: 11px ui-monospace, monospace; color: #8a8d98; z-index: 10; }
#proto-toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: #fff; color: #111; padding: 6px 14px; border-radius: 8px; font: 13px system-ui; opacity: 0; transition: opacity .2s; z-index: 11; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="proto-state"></div>
<div id="proto-toast"></div>
<div id="proto-bar">
  <span class="tag">PROTOTYPE</span>
  <button data-nav="-1" title="Previous variant (←)">←</button>
  <span class="lbl" id="proto-label"></span>
  <button data-nav="1" title="Next variant (→)">→</button>
  <span class="sep"></span>
  <button data-scr="title">Title</button>
  <button data-scr="play">Play</button>
  <button data-scr="menu">Esc menu</button>
  <span class="sep"></span>
  <button data-jump="choice" title="New game, run to the player choice">@choice</button>
  <button data-jump="decide" title="New game, run to the decide point (in flight)">@decide</button>
  <button data-jump="epilogue" title="New game, run into the epilogue">@epilogue</button>
</div>
<script>
// ── Assets (the demo pack and bundled fonts, read in place) ──
const ASSETS = '../../examples/demo-pack/assets/';
const BG = ASSETS + 'backgrounds/school_gate.png';
const SPRITE = m => ASSETS + 'sprites/ace/' + m + '.png';
const PACK = { name: 'unmei demo', tagline: 'a demo pack' };

// ── The demo pack's script, hand-flattened (scenes/*.unmei) ──
const BLOCKS = {
  start: [{ scene: 'first_meeting' },
    { say: 'Narrator', t: 'Morning light. A folded letter on the ground, half under a shoe.' },
    { sprite: 'neutral' },
    { say: 'Ace', t: "You're not from around here, are you?" },
    { choice: [['Ask about the letter', 'ask'], ['Stay silent', 'silence']] }],
  ask: [{ set: { met: true, letters: 1 } }, { say: 'Ace', t: 'A letter? Ah... you saw that.' }, { set: { aff: 'high' } }, { go: 'reunion' }],
  silence: [{ set: { met: true, aff: 'low' } }, { say: 'Ace', t: "...Fine, don't talk. See if I care." }, { go: 'reunion' }],
  reunion: [{ scene: 'reunion' }, { sprite: null },
    { say: 'Narrator', t: "The gate again, hours later. She's still there." },
    { sprite: 'neutral' }, { decide: 'ace.greet' }],
  'reply.warm': [{ sprite: 'happy' }, { say: 'Ace', t: 'You came back! I... hoped you would.' }, { go: 'epilogue' }],
  'reply.cold': [{ sprite: 'neutral' }, { say: 'Ace', t: "Oh. It's you." }, { go: 'epilogue' }],
  epilogue: null, // built from state on entry, like the scene's if/else
};
function epilogue(v) {
  const L = [{ scene: 'epilogue' }];
  if (v.aff === 'high') {
    L.push({ say: 'Narrator', t: 'She lingers by the gate, in no hurry to leave.' });
    L.push({ say: 'Ace', t: v.letters > 0 ? 'Keep it. It suits you.' : 'Next time, bring me something.' });
  } else L.push({ say: 'Narrator', t: 'She is already walking away.' });
  if (v.met) L.push({ say: 'Narrator', t: 'You will see her again.' });
  L.push({ end: true });
  return L;
}

const SLOTS = [
  { k: 'Slot 1', st: 'Ok', scene: 'reunion', at: '12 Nov 2026 14:03' },
  { k: 'Slot 2', st: 'Empty' },
  { k: 'Slot 3', st: 'Unreadable', reason: 'saved by a newer Unmei (save version 3)' },
  { k: 'Autosave', st: 'Ok', scene: 'first_meeting', at: '14 Nov 2026 09:41', auto: true },
];
const TABS = ['Save', 'Load', 'Timeline', 'Gallery', 'Settings'];
function slotAction(sl, tab) {
  if (tab === 'Save') {
    if (sl.auto) return { t: 'Load-only', dis: true };
    return { t: sl.st === 'Empty' ? 'Save here' : 'Overwrite', warn: sl.st !== 'Empty' };
  }
  if (sl.st === 'Ok') return { t: 'Load' };
  return { t: sl.st === 'Empty' ? '—' : 'Can’t load', dis: true };
}
function slotMeta(sl) {
  if (sl.st === 'Ok') return [sl.scene, sl.at];
  if (sl.st === 'Empty') return ['—', 'no save yet'];
  return ['Unreadable', sl.reason];
}

// ── Runtime model (in memory only) ──
const S = {
  screen: 'title', started: false, block: 'start', i: 0, code: [], vars: {},
  scene: '', sprite: null, wait: null, line: null, shown: 0, choice: null,
  decide: null, log: [], auto: false, skip: false, tab: 'Save', tf: 1,
};
let decideTimer = null;

function newGame() {
  clearTimeout(decideTimer);
  Object.assign(S, { started: true, vars: {}, sprite: null, log: [], decide: null, screen: 'play' });
  enter('start');
}
function enter(block) {
  S.block = block; S.i = 0;
  S.code = block === 'epilogue' ? epilogue(S.vars) : BLOCKS[block];
  run();
}
function run() {
  for (;;) {
    const b = S.code[S.i++];
    if (!b) { S.wait = 'end'; return; }
    if (b.scene) { S.scene = b.scene; S.log.push({ kind: 'scene', t: b.scene }); continue; }
    if ('sprite' in b) { S.sprite = b.sprite; continue; }
    if (b.set) { Object.assign(S.vars, b.set); continue; }
    if (b.go) return enter(b.go);
    if (b.say) { S.wait = 'say'; S.line = { who: b.say, t: b.t }; S.shown = 0; S.log.push({ kind: 'say', who: b.say, t: b.t }); return; }
    if (b.choice) { S.wait = 'choice'; S.choice = b.choice; return; }
    if (b.decide) {
      S.wait = 'decide'; S.decide = { id: b.decide, status: 'in flight' };
      decideTimer = setTimeout(resolveDecide, 2400);
      return;
    }
    if (b.end) { S.wait = 'end'; S.line = null; return; }
  }
}
function resolveDecide() {
  const action = S.vars.aff === 'high' ? 'warm' : 'cold';
  S.decide = { id: S.decide.id, status: 'answered', action, by: 'model' };
  if (S.screen === 'menu') { S.decide.held = true; render(); return; } // held until resume
  applyDecide();
}
function applyDecide() {
  S.log.push({ kind: 'decided', action: S.decide.action, by: S.decide.by });
  const a = S.decide.action; S.decide = null;
  enter('reply.' + a); render();
}
function full() { return S.line && S.shown >= S.line.t.length; }
function advance() {
  if (S.screen !== 'play') return;
  if (S.wait === 'say') {
    if (!full()) { S.shown = S.line.t.length; paintProse(); return; }
    run(); render();
  } else if (S.wait === 'end') { S.screen = 'title'; S.started = false; render(); }
}
function choose(n) {
  if (S.screen !== 'play' || S.wait !== 'choice' || !S.choice[n]) return;
  const [t, go] = S.choice[n];
  S.log.push({ kind: 'pick', t }); S.choice = null;
  enter(go); render();
}
function openMenu() { if (!S.started) return; S.screen = 'menu'; render(); }
function resume() { S.screen = 'play'; if (S.decide && S.decide.held) applyDecide(); else render(); }

const TITLE_ITEMS = () => [
  { label: 'Continue', ic: '▶', sub: S.started ? S.scene : 'No autosave yet', dis: !S.started },
  { label: 'New Game', ic: '✦', sub: 'from the beginning' },
  { label: 'Settings', ic: '⚙', sub: 'audio, play, decisions' },
  { label: 'Gallery', ic: '▦', sub: 'stills you have seen' },
  { label: 'Quit', ic: '⏻', sub: '', rule: true },
];
function titleAct(n) {
  const it = TITLE_ITEMS()[n]; if (!it || it.dis) return;
  if (it.label === 'Continue') { S.screen = 'play'; render(); }
  else if (it.label === 'New Game') { newGame(); render(); }
  else toast(it.label + ' is out of scope for this prototype');
}
function reasonLine() { return S.started ? S.scene : 'No autosave yet'; }

// ── Shared bits each variant may use (no shared layout) ──
const isNarr = w => w === 'Narrator';
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const proseSpan = cls => `<span class="${cls}" data-prose></span>`;
const dots = '<span class="dots"><i></i><i></i><i></i></span>';
const cueText = () => S.skip ? 'SKIP' : S.auto ? 'AUTO' : '';

// ───────────── Variant A · Classic ADV box ─────────────
const VariantA = {
  name: 'Classic ADV box',
  title() {
    const items = TITLE_ITEMS();
    return `<div class="scr vA"><div class="bg" style="background-image:url(${BG})"></div><div class="t-scrim"></div>
      <div class="t-col"><div class="t-word">${PACK.name}</div><div class="t-tag">${PACK.tagline.toUpperCase()}</div>
      <ul class="t-menu">${items.map((it, i) => `<li class="${i === S.tf ? 'f' : ''} ${it.dis ? 'dis' : ''} ${it.rule ? 'rule' : ''}" data-act="title:${i}">${it.label}</li>`).join('')}</ul>
      <div class="t-reason">${reasonLine()}</div></div>
      <div class="t-legend">↑/↓ move · Enter select · click to choose</div></div>`;
  },
  frame() {
    let box = '';
    if (S.wait === 'say' || S.wait === 'decide' || S.wait === 'choice' || S.wait === 'end') {
      const who = S.wait === 'decide' ? 'Ace' : S.line && S.line.who;
      let inner;
      if (S.wait === 'decide') inner = `<div class="thinking">Ace is deciding how to greet you ${dots}<small>ace.greet · ${S.decide.status}</small></div>`;
      else if (S.wait === 'end') inner = `<div class="prose narr">— End of the demo. Click to return to the title. —</div>`;
      else inner = proseSpan('prose' + (isNarr(who) ? ' narr' : ''));
      box = `<div class="box" data-act="advance">
        ${who && !isNarr(who) && S.wait !== 'end' ? `<div class="plate">${who}</div>` : ''}
        <div class="prose ${isNarr(who) ? 'narr' : ''}">${inner}</div>
        ${S.wait === 'say' ? '<div class="next" data-next>▼</div>' : ''}
        <div class="quick mono"><span data-act="menu:Save">SAVE</span><span data-act="menu:Load">LOAD</span>
          <span data-act="auto" class="${S.auto ? 'on' : ''}">AUTO</span><span data-act="skip" class="${S.skip ? 'on' : ''}">SKIP</span>
          <span data-act="menu:Timeline">LOG</span><span class="grow"></span><span data-act="menu:Settings">MENU · ESC</span></div></div>`;
    }
    const choices = S.wait === 'choice' ? `<div class="choices">${S.choice.map(([t], i) => `<div class="choice" data-act="choose:${i}"><b>${i + 1}</b>${esc(t)}</div>`).join('')}</div>` : '';
    return `<div class="bg" style="background-image:url(${BG})"></div>
      ${S.sprite ? `<img class="sprite" src="${SPRITE(S.sprite)}">` : ''}${choices}${box}`;
  },
  play() { return `<div class="scr vA">${this.frame()}</div>`; },
  menu() {
    const slots = S.tab === 'Save' || S.tab === 'Load';
    return `<div class="scr vA">${this.frame()}<div class="m-dim" data-act="resume"></div>
      <div class="drawer"><div class="d-head"><b>${PACK.name}</b><span>scene: ${S.scene}</span></div>
      <div class="seg">${TABS.slice(0, 2).map(t => `<span class="${t === S.tab ? 'on' : ''}" data-act="tab:${t}">${t}</span>`).join('')}</div>
      ${slots ? SLOTS.map(sl => { const a = slotAction(sl, S.tab), [m1, m2] = slotMeta(sl);
        return `<div class="slot"><div class="k">${sl.k}</div><div class="meta">${m1}<br>${m2}</div><div class="act ${a.dis ? 'dis' : ''} ${a.warn ? 'warn' : ''}">${a.t}</div></div>`; }).join('')
        : `<div class="ph">${S.tab} view — follows the chosen variant.</div>`}
      <div class="d-nav">
        <div data-act="tab:Timeline">Timeline<span>T</span></div><div data-act="tab:Gallery">Gallery<span>G</span></div>
        <div data-act="tab:Settings">Settings<span>⚙</span></div><div data-act="title">Exit to title<span></span></div>
        <div class="resume" data-act="resume">▶ Resume<span>ESC</span></div></div></div></div>`;
  },
};

// ───────────── Variant B · Novel page (NVL) ─────────────
const VariantB = {
  name: 'Novel page (NVL)',
  title() {
    const items = TITLE_ITEMS();
    return `<div class="scr vB"><div class="bg" style="background-image:url(${BG})"></div><div class="t-veil"></div><div class="t-frame"></div>
      <div class="t-center"><div class="t-tag">${PACK.tagline.toUpperCase()}</div><div class="t-word">${PACK.name}</div><div class="t-rule"></div></div>
      <div class="t-menu">${items.map((it, i) => `<span class="${i === S.tf ? 'f' : ''} ${it.dis ? 'dis' : ''}" data-act="title:${i}">${it.label}</span>`).join('')}</div>
      <div class="t-reason">${reasonLine()}</div></div>`;
  },
  frame() {
    // The page holds the current scene's lines; earlier lines dim.
    let lastScene = 0; S.log.forEach((e, i) => { if (e.kind === 'scene') lastScene = i; });
    const page = S.log.slice(lastScene + 1);
    const curIdx = S.wait === 'say' ? page.length - 1 : -1;
    const ps = page.map((e, i) => {
      if (e.kind === 'pick') return `<div class="p pick">${esc(e.t)}</div>`;
      if (e.kind === 'decided') return `<div class="p dec">ACE DECIDED · ${e.action.toUpperCase()}</div>`;
      const cur = i === curIdx;
      return `<div class="p ${cur ? 'cur' : ''} ${isNarr(e.who) ? 'narr' : ''}">${isNarr(e.who) ? '' : `<span class="who">${e.who.toUpperCase()}</span>`}${cur ? proseSpan('') + '<span class="caret" data-next>▍</span>' : esc(e.t)}</div>`;
    }).join('');
    let tail = '';
    if (S.wait === 'choice') tail = `<div class="opts">${S.choice.map(([t], i) => `<div class="opt" data-act="choose:${i}"><b>${i + 1}</b>${esc(t)}</div>`).join('')}</div>`;
    if (S.wait === 'decide') tail = `<div class="wait">Ace looks at you, deciding ${dots}</div>`;
    if (S.wait === 'end') tail = `<div class="wait">— end of the demo —</div>`;
    return `<div class="bg" style="background-image:url(${BG})"></div><div class="veil"></div>
      ${S.sprite ? `<img class="sprite" src="${SPRITE(S.sprite)}">` : ''}
      <div class="runhead">${PACK.name.toUpperCase()} · ${S.scene.replace('_', ' ').toUpperCase()}${cueText() ? ' · ' + cueText() : ''}</div>
      <div class="page" data-act="advance">${ps}${tail}</div>
      <div class="foot">Space next · 1–9 choose · A auto · Tab skip · Esc contents</div>`;
  },
  play() { return `<div class="scr vB">${this.frame()}</div>`; },
  menu() {
    const slots = S.tab === 'Save' || S.tab === 'Load';
    return `<div class="scr vB"><div class="contents">
      <div class="c-left"><div class="lbl">CONTENTS</div>
        ${TABS.map(t => `<div class="it ${t === S.tab ? 'on' : ''}" data-act="tab:${t}">${t}</div>`).join('')}
        <div class="bot"><span class="resume" data-act="resume">▶ Resume reading</span><span data-act="title">Exit to title</span></div></div>
      <div class="c-right">${slots ? `<h2>${S.tab === 'Save' ? 'Save your place' : 'Return to a page'} — you are in <b>${S.scene}</b></h2>
        <div class="ledger">${SLOTS.map(sl => { const a = slotAction(sl, S.tab), [m1, m2] = slotMeta(sl);
          return `<div class="k">${sl.k.toUpperCase()}</div><div class="meta">${m1}<small>${m2}</small></div><div class="act ${a.dis ? 'dis' : ''}">${a.t}</div>`; }).join('')}</div>`
        : `<div class="ph">${S.tab} — follows the chosen variant.</div>`}</div></div></div>`;
  },
};

// ───────────── Variant C · Cinematic letterbox ─────────────
const VariantC = {
  name: 'Cinematic letterbox',
  title() {
    const items = TITLE_ITEMS();
    return `<div class="scr vC"><div class="bg" style="background-image:url(${BG})"></div><div class="t-shade"></div>
      <div class="t-tag">${PACK.tagline.toUpperCase()}</div><div class="t-word">${PACK.name}</div>
      <div class="t-row">${items.map((it, i) => `<span class="${i === S.tf ? 'f' : ''} ${it.dis ? 'dis' : ''} ${it.rule ? 'end' : ''}" data-act="title:${i}">${it.label}</span>`).join('')}</div>
      <div class="t-reason">${reasonLine()}</div></div>`;
  },
  frame() {
    let bot = '';
    if (S.wait === 'say') bot = `${isNarr(S.line.who) ? '' : `<div class="who">${S.line.who}</div>`}${proseSpan('prose' + (isNarr(S.line.who) ? ' narr' : ''))}`;
    if (S.wait === 'choice') bot = `<div class="ask">${S.line ? esc(S.line.who.toUpperCase() + ' — ' + S.line.t) : 'CHOOSE'}</div><div class="pills">${S.choice.map(([t], i) => `<div class="pill" data-act="choose:${i}"><b>${i + 1}</b>${esc(t)}</div>`).join('')}</div>`;
    if (S.wait === 'decide') bot = `<div class="track"><i></i></div><div class="deciding">Ace is deciding ${dots}<small>DECISION · ACE.GREET · ${S.decide.status.toUpperCase()}</small></div>`;
    if (S.wait === 'end') bot = `<div class="prose narr">End of the demo.</div>`;
    return `<div class="bg" style="background-image:url(${BG})"></div>
      ${S.sprite ? `<img class="sprite" src="${SPRITE(S.sprite)}">` : ''}
      <div class="bar top"><span class="scene">${S.scene.replace('_', ' ').toUpperCase()}</span><span class="cue">${cueText()}</span></div>
      <div class="bar bot" data-act="advance">${bot}<div class="hint">Esc menu</div></div>`;
  },
  play() { return `<div class="scr vC">${this.frame()}</div>`; },
  menu() {
    const slots = S.tab === 'Save' || S.tab === 'Load';
    return `<div class="scr vC">${this.frame()}<div class="sheet">
      <div class="tabs">${TABS.map(t => `<span class="${t === S.tab ? 'on' : ''}" data-act="tab:${t}">${t}</span>`).join('')}
        <span class="r" data-act="title" style="color:#8d909c">Exit to title</span><span data-act="resume" style="color:#e69e5c">▶ Resume</span></div>
      ${slots ? `<div class="strip">${SLOTS.map(sl => { const a = slotAction(sl, S.tab), [m1, m2] = slotMeta(sl);
        return `<div class="frame"><div class="art ${sl.st === 'Ok' ? '' : 'empty'}" style="${sl.st === 'Ok' ? `background-image:url(${BG})` : ''}"><span>${sl.k.toUpperCase()}</span></div>
          <div class="cap">${m1}<small>${m2}</small><em class="${a.dis ? 'dis' : ''}">${a.t}</em></div></div>`; }).join('')}</div>`
        : `<div class="ph">${S.tab} — follows the chosen variant.</div>`}</div></div>`;
  },
};

// ───────────── Variant D · Chat side panel ─────────────
const VariantD = {
  name: 'Chat side panel',
  title() {
    const items = TITLE_ITEMS();
    return `<div class="scr vD"><div class="stagebg" style="background-image:url(${BG})"></div>      <div class="panel"><div class="t-panel"><div class="t-word">${PACK.name}</div><div class="t-tag">${PACK.tagline.toUpperCase()}</div>
      ${items.map((it, i) => `<div class="row ${i === S.tf ? 'f' : ''} ${it.dis ? 'dis' : ''} ${it.rule ? 'sep' : ''}" data-act="title:${i}"><div class="ic">${it.ic}</div><div><b>${it.label}</b><small>${it.sub}</small></div></div>`).join('')}
      </div><div class="t-legend">↑/↓ move · Enter select · click to choose</div></div></div>`;
  },
  head() {
    return `<div class="ph-head"><div class="av">A</div><div><b>Ace</b><small>${S.scene} · ${PACK.name}</small></div><span class="cue">${cueText()}</span></div>`;
  },
  log() {
    const n = S.log.length;
    const items = S.log.slice(-9).map((e, k) => {
      const i = n - Math.min(n, 9) + k, last = i === n - 1 && S.wait === 'say', old = i < n - 4 ? 'old' : '';
      if (e.kind === 'scene') return `<div class="div ${old}">— ${e.t.replace('_', ' ').toUpperCase()} —</div>`;
      if (e.kind === 'pick') return `<div class="me ${old}">${esc(e.t)}</div>`;
      if (e.kind === 'decided') return `<div class="tag ${old}">decided live · ${e.action}</div>`;
      const body = last ? proseSpan('') : esc(e.t);
      if (isNarr(e.who)) return `<div class="sys ${old}">${body}</div>`;
      return `<div class="msg ${old}"><div class="av">A</div><div class="bub">${body}</div></div>`;
    }).join('');
    const typing = S.wait === 'decide' ? `<div class="msg"><div class="av">A</div><div class="bub">${dots}</div></div><div class="tag">deciding · ${S.decide.id} · ${S.decide.status}</div>` : '';
    return `<div class="log">${items}${typing}${S.wait === 'end' ? '<div class="div">— END OF THE DEMO —</div>' : ''}</div>`;
  },
  frame(panelInner) {
    return `<div class="stagebg" style="background-image:url(${BG})"></div>
      ${S.sprite ? `<img class="sprite" src="${SPRITE(S.sprite)}">` : ''}<div class="panel">${panelInner}</div>`;
  },
  play() {
    const replies = S.wait === 'choice'
      ? S.choice.map(([t], i) => `<div class="reply" data-act="choose:${i}"><b>${i + 1}</b>${esc(t)}</div>`).join('')
      : `<div class="tap"><span>click or Space to continue</span><span>A auto · Tab skip · Esc menu</span></div>`;
    return `<div class="scr vD" >${this.frame(`${this.head()}<div style="flex:1;display:flex" data-act="advance">${this.log()}</div><div class="replies">${replies}</div>`)}</div>`;
  },
  menu() {
    const slots = S.tab === 'Save' || S.tab === 'Load';
    const body = `<div class="ph-head"><div class="av">≡</div><div><b>Paused</b><small>${S.scene} · ${PACK.name}</small></div>
        <div class="seg">${TABS.slice(0, 2).map(t => `<span class="${t === S.tab ? 'on' : ''}" data-act="tab:${t}">${t}</span>`).join('')}</div></div>
      <div class="m-body"><div class="grp">${slots ? 'SLOTS' : S.tab.toUpperCase()}</div>
      ${slots ? SLOTS.map(sl => { const a = slotAction(sl, S.tab), [m1, m2] = slotMeta(sl);
        return `<div class="srow"><div class="k">${sl.k}</div><div class="meta">${m1}<br>${m2}</div><em class="${a.dis ? 'dis' : ''}">${a.t}</em></div>`; }).join('')
        : `<div class="srow"><div class="meta">${S.tab} — follows the chosen variant.</div></div>`}
      <div class="grp">EXPLORE</div>
      <div class="row" data-act="tab:Timeline"><div class="ic">≣</div><div><b>Timeline</b><small>scenes in order</small></div></div>
      <div class="row" data-act="tab:Gallery"><div class="ic">▦</div><div><b>Gallery</b><small>stills you have seen</small></div></div>
      <div class="row" data-act="tab:Settings"><div class="ic">⚙</div><div><b>Settings</b><small>audio, play, decisions</small></div></div></div>
      <div class="replies"><div class="reply" data-act="resume"><b>ESC</b>Resume</div><div class="tap"><span data-act="title">Exit to title</span><span></span></div></div>`;
    return `<div class="scr vD">${this.frame(body)}<div class="m-art-dim" data-act="resume"></div></div>`;
  },
};

// ───────────── Variant E · Mix (picked 2026-11-14) ─────────────
// A's dialogue box, centred choices and left-list title; B's full-screen
// contents page as the Esc menu.
const VariantE = {
  name: 'Mix: A play + title, B menu',
  title: () => VariantA.title(),
  play: () => VariantA.play(),
  menu: () => VariantB.menu(),
};

// ── Switcher wiring ──
const VARIANTS = { A: VariantA, B: VariantB, C: VariantC, D: VariantD, E: VariantE };
const KEYS = Object.keys(VARIANTS);
const params = new URLSearchParams(location.search);
let cur = KEYS.includes(params.get('variant')) ? params.get('variant') : 'A';
const want = params.get('screen');
const stage = document.getElementById('stage');

function syncUrl() {
  const p = new URLSearchParams(location.search);
  p.set('variant', cur); p.set('screen', S.screen);
  history.replaceState(null, '', '?' + p);
}
function render() {
  const V = VARIANTS[cur];
  stage.innerHTML = V[S.screen]();
  paintProse();
  document.getElementById('proto-label').textContent = `${cur} (${V.name})`;
  document.querySelectorAll('[data-scr]').forEach(b => b.classList.toggle('on', b.dataset.scr === S.screen));
  const d = S.decide ? ` · decide=${S.decide.id}:${S.decide.status}${S.decide.held ? '(held)' : ''}` : '';
  document.getElementById('proto-state').textContent =
    `variant=${cur} screen=${S.screen} scene=${S.scene || '-'} wait=${S.wait || '-'}${d} · vars=${JSON.stringify(S.vars)} · auto=${S.auto} skip=${S.skip}`;
  syncUrl();
}
function paintProse() {
  // At a choice the question stays on screen in full.
  const t = !S.line ? '' : S.wait === 'say' ? S.line.t.slice(0, S.shown) : S.wait === 'choice' ? S.line.t : '';
  stage.querySelectorAll('[data-prose]').forEach(el => { el.textContent = t; });
  stage.querySelectorAll('[data-next]').forEach(el => { el.style.visibility = full() ? 'visible' : 'hidden'; });
}
function setVariant(k) { cur = k; render(); }
function toast(t) { const el = document.getElementById('proto-toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.opacity = 0, 1600); }
function setScreen(scr) {
  if (scr !== 'title' && !S.started) newGame();
  if (scr === 'menu') S.tab = 'Save';
  if (scr === 'play' && S.decide && S.decide.held) { S.screen = 'play'; applyDecide(); return; }
  S.screen = scr; render();
}
function jump(target) {
  newGame();
  for (let n = 0; n < 40; n++) {
    if (target === 'choice' && S.wait === 'choice') break;
    if (target === 'decide' && S.wait === 'decide') break;
    if (target === 'epilogue' && S.scene === 'epilogue') break;
    if (S.wait === 'say') run(); else if (S.wait === 'choice') choose(0);
    else if (S.wait === 'decide') { clearTimeout(decideTimer); S.decide = { id: S.decide.id, status: 'answered', action: 'warm', by: 'model' }; applyDecide(); }
    else break;
  }
  S.screen = 'play'; render();
}

// Text reveal (~45 cps), auto and skip.
let autoAt = 0;
setInterval(() => {
  if (S.screen !== 'play' || S.wait !== 'say') return;
  if (S.skip) { S.shown = S.line.t.length; run(); render(); return; }
  if (!full()) { S.shown = Math.min(S.line.t.length, S.shown + 1); paintProse(); autoAt = performance.now() + 1500 + S.line.t.length * 20; return; }
  if (S.auto && performance.now() > autoAt) { run(); render(); }
}, 22);

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]'); if (nav) { const i = KEYS.indexOf(cur); setVariant(KEYS[(i + +nav.dataset.nav + KEYS.length) % KEYS.length]); return; }
  const scr = e.target.closest('[data-scr]'); if (scr) { setScreen(scr.dataset.scr); return; }
  const j = e.target.closest('[data-jump]'); if (j) { jump(j.dataset.jump); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const [verb, arg] = a.dataset.act.split(':');
  if (verb === 'advance') advance();
  else if (verb === 'choose') choose(+arg);
  else if (verb === 'title') { if (arg !== undefined) { S.tf = +arg; titleAct(+arg); } else { S.screen = 'title'; render(); } }
  else if (verb === 'menu') { S.tab = arg; openMenu(); }
  else if (verb === 'tab') { S.tab = arg; render(); }
  else if (verb === 'resume') resume();
  else if (verb === 'auto') { S.auto = !S.auto; render(); }
  else if (verb === 'skip') { S.skip = !S.skip; render(); }
  e.stopPropagation();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const i = KEYS.indexOf(cur); setVariant(KEYS[(i + (e.key === 'ArrowRight' ? 1 : -1) + KEYS.length) % KEYS.length]); e.preventDefault(); return;
  }
  if (S.screen === 'title') {
    const n = TITLE_ITEMS().length;
    if (e.key === 'ArrowDown') { S.tf = (S.tf + 1) % n; render(); }
    if (e.key === 'ArrowUp') { S.tf = (S.tf - 1 + n) % n; render(); }
    if (e.key === 'Enter') titleAct(S.tf);
    return;
  }
  if (e.key === 'Escape') { S.screen === 'menu' ? resume() : (S.tab = 'Save', openMenu()); return; }
  if (S.screen !== 'play') return;
  if (e.key === ' ' || e.key === 'Enter') { advance(); e.preventDefault(); }
  if (/^[1-9]$/.test(e.key)) choose(+e.key - 1);
  if (e.key === 'a' || e.key === 'A') { S.auto = !S.auto; render(); }
  if (e.key === 'Tab') { S.skip = !S.skip; render(); e.preventDefault(); }
});
function fit() { const s = Math.min(innerWidth / 1280, (innerHeight - 64) / 720); stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();

if (want === 'play' || want === 'menu') { newGame(); S.screen = want; }
render();
</script>
</body>
</html>
