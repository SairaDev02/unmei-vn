<!doctype html>
<!--
  PROTOTYPE — throwaway. Not part of the player build. Lives on branch
  `prototype/8-vn-visual-language` only; never merge to main.

  Question: which visual language (colour, type, shape, depth, ornament)
  should dress the settled variant E layout (docs/title-and-menu.md
  § Default look)?

  Plan: three visual languages, each written as a DESIGN.md
  (https://github.com/google-labs-code/design.md, format "alpha") in
  `visual-language/<name>/DESIGN.md`, rendered on one shared variant E
  structure and switchable via `?variant=A|B|C` and the floating bar.
  `?screen=title|play|menu` picks the surface. Variants differ in visual
  language on purpose, not in layout: E's geometry is settled.

  The DESIGN.md files drive the mockup: the page fetches each file, parses
  its YAML front matter, resolves `{group.token}` references and emits CSS
  custom properties (--c-*, --r-*, --s-*, --k-<component>-*) and one
  `.t-<name>` class per typography token. Edit a DESIGN.md and reload.
  Gradients, shadows and ornaments (which DESIGN.md keeps in prose) are
  hand-written per language below, built from those variables.

  Run (from the repository root):
      python -m http.server 8137
  then open http://localhost:8137/app/prototype/vn-visual.html
  Lint: npx -p @google/design.md designmd lint app/prototype/visual-language/<name>/DESIGN.md

  Bevy-feasibility constraint (as in vn-ui.html): solid/alpha fills,
  linear/radial gradients, borders, corner radius, box shadow, text shadow,
  images. No backdrop-filter, filter, clip-path, blend modes or inset
  shadows. Animations are opacity/offset loops.
-->

<script>
// ── The three DESIGN.md files ──
const LANGS = {
  A: { id: 'washi', file: 'visual-language/washi/DESIGN.md' },
  B: { id: 'dusk', file: 'visual-language/dusk/DESIGN.md' },
  C: { id: 'pop', file: 'visual-language/pop/DESIGN.md' },
};
const BUNDLED = ['IBM Plex Sans', 'Fira Mono'];

// Minimal YAML front-matter reader: nested maps and scalars only, which is
// all these files use. Not a general YAML parser.
function parseFront(md) {
  const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---/);
  const root = {}; const stack = [{ indent: -1, obj: root }];
  for (const line of m[1].split(/\r?\n/)) {
    if (/^\s*(#|$)/.test(line)) continue;
    const indent = line.match(/^ */)[0].length;
    const kv = line.trim().match(/^([^:]+):\s*(.*)$/);
    while (stack[stack.length - 1].indent >= indent) stack.pop();
    const top = stack[stack.length - 1].obj, key = kv[1].trim(), val = kv[2];
    if (val === '') { const o = {}; top[key] = o; stack.push({ indent, obj: o }); }
    else top[key] = val.replace(/^"(.*)"$/, '$1').replace(/^'(.*)'$/, '$1');
  }
  return root;
}
function resolve(root, v, depth = 0) {
  const r = typeof v === 'string' && v.match(/^\{(.+)\}$/);
  if (!r || depth > 8) return v;
  return resolve(root, r[1].split('.').reduce((o, k) => o && o[k], root), depth + 1);
}
function rgbOf(hex) {
  const h = hex.replace('#', '');
  const f = h.length <= 4 ? h.split('').map(c => c + c).join('') : h;
  return [0, 2, 4].map(i => parseInt(f.slice(i, i + 2), 16));
}
function lum(hex) {
  return rgbOf(hex).map(c => { c /= 255; return c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; })
    .reduce((s, c, i) => s + c * [.2126, .7152, .0722][i], 0);
}
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };
const fontStack = f => BUNDLED.includes(f) ? `"${f}"` : `"${f}", "Yu Mincho", "Hiragino Mincho ProN", Georgia, serif`;

function tokensCss(key, T) {
  const sc = `.L-${LANGS[key].id}`, vars = [];
  for (const [k, v] of Object.entries(T.colors || {})) {
    vars.push(`--c-${k}: ${v}`);
    if (/^#/.test(v)) vars.push(`--rgb-${k}: ${rgbOf(v).join(',')}`);
  }
  for (const [k, v] of Object.entries(T.rounded || {})) vars.push(`--r-${k}: ${v}`);
  for (const [k, v] of Object.entries(T.spacing || {})) vars.push(`--s-${k}: ${v}`);
  const P = { backgroundColor: 'bg', textColor: 'fg', rounded: 'r', padding: 'pad', size: 'size', height: 'height', width: 'width' };
  for (const [c, props] of Object.entries(T.components || {}))
    for (const [p, v] of Object.entries(props)) if (P[p]) vars.push(`--k-${c}-${P[p]}: ${resolve(T, v)}`);
  let css = `${sc} { ${vars.join('; ')} }\n`;
  for (const [k, t] of Object.entries(T.typography || {})) {
    css += `${sc} .t-${k} { font-family: ${fontStack(t.fontFamily)}; font-size: ${t.fontSize}; font-weight: ${t.fontWeight}; ` +
      `line-height: ${t.lineHeight || 'normal'}; letter-spacing: ${t.letterSpacing || 'normal'}; }\n`;
  }
  return css;
}

function tokenPanel(key) {
  const T = LANGS[key].tokens; const esc2 = s => String(s).replace(/</g, '&lt;');
  let h = `<h3>${esc2(T.name)} · <code>${LANGS[key].file}</code></h3><div>${esc2(T.description || '')}</div>`;
  const missing = [...new Set(Object.values(T.typography || {}).map(t => t.fontFamily))].filter(f => !BUNDLED.includes(f));
  if (missing.length) h += `<div class="warn">Not bundled: ${missing.join(', ')} — shown with a system fallback.</div>`;
  h += '<h3>colors</h3>' + Object.entries(T.colors).map(([k, v]) => `<div class="row"><span class="sw" style="background:${v}"></span><code>${k}</code><code style="margin-left:auto">${v}</code></div>`).join('');
  h += '<h3>typography</h3>' + Object.entries(T.typography).map(([k, t]) => `<div class="row"><code>${k}</code><span style="margin-left:auto">${t.fontFamily} ${t.fontWeight} ${t.fontSize}/${t.lineHeight}</span></div>`).join('');
  h += '<h3>rounded · spacing</h3><code>' + Object.entries(T.rounded).map(([k, v]) => `${k}=${v}`).join(' ') + '<br>' + Object.entries(T.spacing).map(([k, v]) => `${k}=${v}`).join(' ') + '</code>';
  h += '<h3>components (WCAG contrast)</h3>' + Object.entries(T.components).map(([c, p]) => {
    const bg = resolve(T, p.backgroundColor), fg = resolve(T, p.textColor);
    const cr = bg && fg && /^#/.test(bg) && /^#/.test(fg) ? contrast(bg, fg) : null;
    return `<div class="row">${bg ? `<span class="sw" style="background:${bg}"></span>` : ''}${fg ? `<span class="sw" style="background:${fg}"></span>` : ''}<code>${c}</code>
      ${cr ? `<span class="${cr >= 4.5 ? 'ok' : 'bad'}" style="margin-left:auto">${cr.toFixed(2)}:1</span>` : ''}</div>`;
  }).join('');
  return h;
}

// ── Assets (the demo pack and bundled fonts, read in place) ──
const ASSETS = '../../examples/demo-pack/assets/';
const BG = ASSETS + 'backgrounds/school_gate.png';
const SPRITE = m => ASSETS + 'sprites/ace/' + m + '.png';
const PACK = { name: 'unmei demo', tagline: 'a demo pack' };

// ── The demo pack's script, hand-flattened (as in vn-ui.html) ──
const BLOCKS = {
  start: [{ scene: 'first_meeting' },
    { say: 'Narrator', t: 'Morning light. A folded letter on the ground, half under a shoe.' },
    { sprite: 'neutral' },
    { say: 'Ace', t: "You're not from around here, are you?" },
    { choice: [['Ask about the letter', 'ask'], ['Stay silent', 'silence']] }],
  ask: [{ set: { met: true, letters: 1 } }, { say: 'Ace', t: 'A letter? Ah... you saw that.' }, { set: { aff: 'high' } }, { go: 'reunion' }],
  silence: [{ set: { met: true, aff: 'low' } }, { say: 'Ace', t: "...Fine, don't talk. See if I care." }, { go: 'reunion' }],
  reunion: [{ scene: 'reunion' }, { sprite: null },
    { say: 'Narrator', t: "The gate again, hours later. She's still there." },
    { sprite: 'neutral' }, { decide: 'ace.greet' }],
  'reply.warm': [{ sprite: 'happy' }, { say: 'Ace', t: 'You came back! I... hoped you would.' }, { go: 'epilogue' }],
  'reply.cold': [{ sprite: 'neutral' }, { say: 'Ace', t: "Oh. It's you." }, { go: 'epilogue' }],
  epilogue: null,
};
function epilogue(v) {
  const L = [{ scene: 'epilogue' }];
  if (v.aff === 'high') {
    L.push({ say: 'Narrator', t: 'She lingers by the gate, in no hurry to leave.' });
    L.push({ say: 'Ace', t: v.letters > 0 ? 'Keep it. It suits you.' : 'Next time, bring me something.' });
  } else L.push({ say: 'Narrator', t: 'She is already walking away.' });
  if (v.met) L.push({ say: 'Narrator', t: 'You will see her again.' });
  L.push({ end: true });
  return L;
}
const SLOTS = [
  { k: 'Slot 1', st: 'Ok', scene: 'reunion', at: '12 Nov 2026 14:03' },
  { k: 'Slot 2', st: 'Empty' },
  { k: 'Slot 3', st: 'Unreadable', reason: 'saved by a newer Unmei (save version 3)' },
  { k: 'Autosave', st: 'Ok', scene: 'first_meeting', at: '14 Nov 2026 09:41', auto: true },
];
const TABS = ['Save', 'Load', 'Timeline', 'Gallery', 'Settings'];
function slotAction(sl, tab) {
  if (tab === 'Save') {
    if (sl.auto) return { t: 'Load-only', dis: true };
    return { t: sl.st === 'Empty' ? 'Save here' : 'Overwrite', warn: sl.st !== 'Empty' };
  }
  if (sl.st === 'Ok') return { t: 'Load' };
  return { t: sl.st === 'Empty' ? '—' : 'Can’t load', dis: true };
}
function slotMeta(sl) {
  if (sl.st === 'Ok') return [sl.scene, sl.at];
  if (sl.st === 'Empty') return ['—', 'no save yet'];
  return ['Unreadable', sl.reason];
}

// ── Runtime model (in memory only) ──
const S = {
  screen: 'title', started: false, block: 'start', i: 0, code: [], vars: {},
  scene: '', sprite: null, wait: null, line: null, shown: 0, choice: null, cf: 0,
  decide: null, log: [], auto: false, skip: false, tab: 'Save', tf: 1,
};
let decideTimer = null;
function newGame() {
  clearTimeout(decideTimer);
  Object.assign(S, { started: true, vars: {}, sprite: null, log: [], decide: null, screen: 'play' });
  enter('start');
}
function enter(block) { S.block = block; S.i = 0; S.code = block === 'epilogue' ? epilogue(S.vars) : BLOCKS[block]; run(); }
function run() {
  for (;;) {
    const b = S.code[S.i++];
    if (!b) { S.wait = 'end'; return; }
    if (b.scene) { S.scene = b.scene; continue; }
    if ('sprite' in b) { S.sprite = b.sprite; continue; }
    if (b.set) { Object.assign(S.vars, b.set); continue; }
    if (b.go) return enter(b.go);
    if (b.say) { S.wait = 'say'; S.line = { who: b.say, t: b.t }; S.shown = 0; return; }
    if (b.choice) { S.wait = 'choice'; S.choice = b.choice; S.cf = 0; return; }
    if (b.decide) { S.wait = 'decide'; S.decide = { id: b.decide, status: 'in flight' }; decideTimer = setTimeout(resolveDecide, 2400); return; }
    if (b.end) { S.wait = 'end'; S.line = null; return; }
  }
}
function resolveDecide() {
  S.decide = { id: S.decide.id, status: 'answered', action: S.vars.aff === 'high' ? 'warm' : 'cold' };
  if (S.screen === 'menu') { S.decide.held = true; render(); return; }
  applyDecide();
}
function applyDecide() { const a = S.decide.action; S.decide = null; enter('reply.' + a); render(); }
function full() { return S.line && S.shown >= S.line.t.length; }
function advance() {
  if (S.screen !== 'play') return;
  if (S.wait === 'say') { if (!full()) { S.shown = S.line.t.length; paintProse(); return; } run(); render(); }
  else if (S.wait === 'end') { S.screen = 'title'; S.started = false; render(); }
}
function choose(n) {
  if (S.screen !== 'play' || S.wait !== 'choice' || !S.choice[n]) return;
  const go = S.choice[n][1]; S.choice = null; enter(go); render();
}
function openMenu() { if (!S.started) return; S.screen = 'menu'; render(); }
function resume() { S.screen = 'play'; if (S.decide && S.decide.held) applyDecide(); else render(); }
const TITLE_ITEMS = () => [
  { label: 'Continue', dis: !S.started }, { label: 'New Game' }, { label: 'Settings' }, { label: 'Gallery' }, { label: 'Quit', rule: true },
];
function titleAct(n) {
  const it = TITLE_ITEMS()[n]; if (!it || it.dis) return;
  if (it.label === 'Continue') { S.screen = 'play'; render(); }
  else if (it.label === 'New Game') { newGame(); render(); }
  else toast(it.label + ' is out of scope for this prototype');
}

// ── Variant E structure, rendered once for every language ──
const isNarr = w => w === 'Narrator';
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const dots = '<span class="dots"><i></i><i></i><i></i></span>';
const E = {
  title() {
    return `<div class="bg" style="background-image:url(${BG})"></div><div class="t-back"></div>
      <div class="t-col"><div class="t-word t-wordmark">${PACK.name}</div><div class="t-tag t-label upper">${PACK.tagline}</div>
      <ul class="t-menu">${TITLE_ITEMS().map((it, i) => `<li class="t-title-item ${i === S.tf ? 'f' : ''} ${it.dis ? 'dis' : ''} ${it.rule ? 'rule-above' : ''}" data-act="title:${i}">${it.label}</li>`).join('')}</ul>
      <div class="t-reason t-label">${S.started ? S.scene : 'No autosave yet'}</div></div>
      <div class="t-legend t-label">↑/↓ move · Enter select · click to choose</div>`;
  },
  play() {
    let box = '';
    if (S.wait) {
      const who = S.wait === 'decide' ? 'Ace' : S.line && S.line.who;
      const narr = isNarr(who) && S.wait !== 'decide';
      let inner;
      if (S.wait === 'decide') inner = `<div class="thinking t-prose"><span class="orb"></span>${dots}<span>Ace is deciding how to greet you</span><small class="t-label">ace.greet · ${S.decide.status}</small></div>`;
      else if (S.wait === 'end') inner = `<div class="t-narration narr">— End of the demo. Click to return to the title. —</div>`;
      else inner = `<span class="${narr ? 't-narration narr' : 't-prose'}" data-prose></span>`;
      box = `<div class="box" data-act="advance"><i class="rule"></i><i class="edge"></i>
        ${who && !narr && S.wait !== 'end' ? `<div class="plate t-name">${who}</div>` : ''}
        <div>${inner}</div>
        ${S.wait === 'say' ? '<div class="next" data-next>▼</div>' : ''}
        <div class="quick t-label"><span data-act="menu:Save">SAVE</span><span data-act="menu:Load">LOAD</span>
          <span data-act="auto" class="${S.auto ? 'on' : ''}">AUTO</span><span data-act="skip" class="${S.skip ? 'on' : ''}">SKIP</span>
          <span data-act="menu:Timeline">LOG</span><span class="grow"></span><span data-act="menu:Settings">MENU · ESC</span></div></div>`;
    }
    const choices = S.wait === 'choice' ? `<div class="choices">${S.choice.map(([t], i) =>
      `<div class="choice t-choice ${i === S.cf ? 'f' : ''}" data-act="choose:${i}"><i class="rule"></i><b class="badge t-label">${i + 1}</b>${esc(t)}</div>`).join('')}</div>` : '';
    return `<div class="bg" style="background-image:url(${BG})"></div>${S.sprite ? `<img class="sprite" src="${SPRITE(S.sprite)}">` : ''}${choices}${box}`;
  },
  menu() {
    const slots = S.tab === 'Save' || S.tab === 'Load';
    return `<div class="contents">
      <div class="c-left"><div class="lbl t-label">CONTENTS</div>
        ${TABS.map(t => `<div class="it t-menu-entry ${t === S.tab ? 'on' : ''}" data-act="tab:${t}">${t}</div>`).join('')}
        <div class="bot t-body"><span class="resume" data-act="resume">▶ Resume reading</span><span data-act="title">Exit to title</span></div></div>
      <div class="c-right">${slots ? `<h2 class="t-body">${S.tab === 'Save' ? 'Save your place' : 'Return to a page'} — you are in <b>${S.scene}</b></h2>
        ${SLOTS.map(sl => { const a = slotAction(sl, S.tab), [m1, m2] = slotMeta(sl);
          return `<div class="srow"><div class="k t-label">${sl.k.toUpperCase()}</div><div class="t-body">${m1}<small class="t-label">${m2}</small></div>
            <div class="act t-body ${a.dis ? 'dis' : ''} ${a.warn ? 'warn' : ''}">${a.t}</div></div>`; }).join('')}`
        : `<h2 class="t-body">${S.tab} — out of scope for this prototype.</h2>`}</div></div>`;
  },
};

// ── Switcher wiring ──
const KEYS = Object.keys(LANGS);
const params = new URLSearchParams(location.search);
let cur = KEYS.includes(params.get('variant')) ? params.get('variant') : 'A';
const stage = document.getElementById('stage');
function syncUrl() { const p = new URLSearchParams(location.search); p.set('variant', cur); p.set('screen', S.screen); history.replaceState(null, '', '?' + p); }
function render() {
  const L = LANGS[cur];
  stage.innerHTML = `<div class="scr L-${L.id}">${E[S.screen]()}</div>`;
  paintProse();
  document.getElementById('proto-label').textContent = `${cur} (${L.tokens.name.replace('Unmei ', '')})`;
  document.querySelectorAll('[data-scr]').forEach(b => b.classList.toggle('on', b.dataset.scr === S.screen));
  document.getElementById('proto-tok').innerHTML = tokenPanel(cur);
  const d = S.decide ? ` · decide=${S.decide.id}:${S.decide.status}${S.decide.held ? '(held)' : ''}` : '';
  document.getElementById('proto-state').textContent = `variant=${cur} lang=${L.id} screen=${S.screen} scene=${S.scene || '-'} wait=${S.wait || '-'}${d} · vars=${JSON.stringify(S.vars)}`;
  syncUrl();
}
function paintProse() {
  const t = !S.line ? '' : S.wait === 'say' ? S.line.t.slice(0, S.shown) : S.wait === 'choice' ? S.line.t : '';
  stage.querySelectorAll('[data-prose]').forEach(el => { el.textContent = t; });
  stage.querySelectorAll('[data-next]').forEach(el => { el.style.visibility = full() ? 'visible' : 'hidden'; });
}
function toast(t) { const el = document.getElementById('proto-toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.opacity = 0, 1600); }
function setScreen(scr) {
  if (scr !== 'title' && !S.started) newGame();
  if (scr === 'menu') S.tab = 'Save';
  if (scr === 'play' && S.decide && S.decide.held) { S.screen = 'play'; applyDecide(); return; }
  S.screen = scr; render();
}
function jump(target) {
  newGame();
  for (let n = 0; n < 40; n++) {
    if (target === 'choice' && S.wait === 'choice') break;
    if (target === 'decide' && S.wait === 'decide') break;
    if (target === 'epilogue' && S.scene === 'epilogue') break;
    if (S.wait === 'say') run(); else if (S.wait === 'choice') choose(0);
    else if (S.wait === 'decide') { clearTimeout(decideTimer); S.decide = { action: 'warm' }; applyDecide(); }
    else break;
  }
  if (S.wait === 'say') S.shown = S.line.t.length;
  S.screen = 'play'; render();
}
let autoAt = 0;
setInterval(() => {
  if (S.screen !== 'play' || S.wait !== 'say') return;
  if (S.skip) { S.shown = S.line.t.length; run(); render(); return; }
  if (!full()) { S.shown = Math.min(S.line.t.length, S.shown + 1); paintProse(); autoAt = performance.now() + 1500 + S.line.t.length * 20; return; }
  if (S.auto && performance.now() > autoAt) { run(); render(); }
}, 22);
function cycle(dir) { const i = KEYS.indexOf(cur); cur = KEYS[(i + dir + KEYS.length) % KEYS.length]; render(); }
function toggleTok() { document.body.classList.toggle('tok'); fit(); }
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]'); if (nav) { cycle(+nav.dataset.nav); return; }
  if (e.target.closest('[data-tok]')) { toggleTok(); return; }
  const scr = e.target.closest('[data-scr]'); if (scr) { setScreen(scr.dataset.scr); return; }
  const j = e.target.closest('[data-jump]'); if (j) { jump(j.dataset.jump); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const [verb, arg] = a.dataset.act.split(':');
  if (verb === 'advance') advance();
  else if (verb === 'choose') choose(+arg);
  else if (verb === 'title') { if (arg !== undefined) { S.tf = +arg; titleAct(+arg); } else { S.screen = 'title'; render(); } }
  else if (verb === 'menu') { S.tab = arg; openMenu(); }
  else if (verb === 'tab') { S.tab = arg; render(); }
  else if (verb === 'resume') resume();
  else if (verb === 'auto') { S.auto = !S.auto; render(); }
  else if (verb === 'skip') { S.skip = !S.skip; render(); }
  e.stopPropagation();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { cycle(e.key === 'ArrowRight' ? 1 : -1); e.preventDefault(); return; }
  if (e.key === 't' || e.key === 'T') { toggleTok(); return; }
  if (S.screen === 'title') {
    const n = TITLE_ITEMS().length;
    if (e.key === 'ArrowDown') { S.tf = (S.tf + 1) % n; render(); }
    if (e.key === 'ArrowUp') { S.tf = (S.tf - 1 + n) % n; render(); }
    if (e.key === 'Enter') titleAct(S.tf);
    return;
  }
  if (e.key === 'Escape') { S.screen === 'menu' ? resume() : (S.tab = 'Save', openMenu()); return; }
  if (S.screen !== 'play') return;
  if (S.wait === 'choice' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { S.cf = (S.cf + (e.key === 'ArrowDown' ? 1 : -1) + S.choice.length) % S.choice.length; render(); return; }
  if (S.wait === 'choice' && e.key === 'Enter') { choose(S.cf); return; }
  if (e.key === ' ' || e.key === 'Enter') { advance(); e.preventDefault(); }
  if (/^[1-9]$/.test(e.key)) choose(+e.key - 1);
  if (e.key === 'a' || e.key === 'A') { S.auto = !S.auto; render(); }
  if (e.key === 'Tab') { S.skip = !S.skip; render(); e.preventDefault(); }
});
function fit() {
  const w = innerWidth - (document.body.classList.contains('tok') ? 380 : 0);
  stage.style.transform = `scale(${Math.min(w / 1280, (innerHeight - 64) / 720)})`;
}
addEventListener('resize', fit); fit();

(async () => {
  let css = '';
  for (const k of KEYS) {
    const md = await (await fetch(LANGS[k].file, { cache: 'no-store' })).text();
    LANGS[k].tokens = parseFront(md);
    css += tokensCss(k, LANGS[k].tokens);
  }
  document.getElementById('tokens').textContent = css;
  const want = params.get('screen');
  if (want === 'play' || want === 'menu') { newGame(); S.screen = want; }
  render();
})();
</script>
